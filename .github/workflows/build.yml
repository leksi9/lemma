name: Сборка установщика

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'CLAUDE.md', '.github/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install --upgrade pywebview pyinstaller

      - name: Страница доски
        run: python build.py doska.html

      - name: Python для блока кода (Pyodide)
        shell: pwsh
        run: |
          $v = "0.26.4"
          New-Item -ItemType Directory -Force app/pyodide | Out-Null
          foreach ($f in "pyodide.js","pyodide.asm.js","pyodide.asm.wasm","python_stdlib.zip","pyodide-lock.json") {
            Invoke-WebRequest "https://cdn.jsdelivr.net/npm/pyodide@$v/$f" -OutFile "app/pyodide/$f"
          }
          Get-ChildItem app/pyodide | Format-Table Name, Length

      - name: Номер версии для автообновления
        shell: pwsh
        run: Set-Content -Encoding utf8 _version.py "VERSION = '$env:VERSION'"

      - name: Lemma.exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name Lemma --icon lemma.ico doska.py

      - name: Страница рядом с exe
        shell: cmd
        run: xcopy /E /I /Y app dist\Lemma\app

      - name: Установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" doska.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Описание версии
        shell: pwsh
        env:
          MSG: ${{ github.event.head_commit.message || 'Обновление Леммы' }}
        run: |
          ($env:MSG -split "`n" | Where-Object { $_ -notmatch '^\s*Claude-Session:' }) -join "`n" | Set-Content -Encoding utf8 notes.md

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Лемма ${{ env.VERSION }}
          body_path: notes.md
          files: Output/Lemma-Setup.exe
          make_latest: true
