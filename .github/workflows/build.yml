name: Сборка установщика

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install --upgrade pywebview pyinstaller

      - name: Страница доски
        run: python build.py doska.html

      - name: Lemma.exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name Lemma --icon lemma.ico --add-data "app;app" doska.py

      - name: Страница рядом с exe
        shell: cmd
        run: xcopy /E /I /Y app dist\Lemma\app

      - name: Установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" doska.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Лемма ${{ env.VERSION }}
          body: |
            Скачайте **Lemma-Setup.exe** и запустите. Права администратора не нужны.
            Доски при обновлении сохраняются.
          files: Output/Lemma-Setup.exe
          make_latest: true
